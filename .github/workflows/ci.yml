name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Protos: lint them, regenerate code, and fail if the committed proto/gen/
  # is out of date (someone changed a .proto but forgot `make gen`).
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - uses: bufbuild/buf-setup-action@v1
      - name: Lint protos
        run: buf lint
      - name: Regenerate
        run: buf generate
      - name: Fail if generated code is stale
        run: git diff --exit-code -- proto/gen || (echo "::error::proto/gen is out of date — run 'make gen' and commit." && exit 1)

  # Build every service image. Fast first version: proves the whole stack
  # compiles and containerizes on every PR. Once services grow, switch to
  # path-filtered per-service jobs so a gateway change doesn't rebuild auth.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images
        run: docker compose build

  # Go services: vet + test. Adjust the matrix as services are added.
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, user, posts, feed, notifications]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false  # no go.sum yet (stdlib only) — enable once deps exist
      - name: Vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: go test ./...

  # Python services: install + import check. Add pytest once tests exist.
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, search]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements.txt
      - name: Import check
        working-directory: services/${{ matrix.service }}
        run: python -c "import main"
