# Inama — full stack on one shared network.
#
# Run EVERYTHING:        docker compose up --build
# Run ONE service:       docker compose up --build gateway
# Run a service + infra:  docker compose up --build auth postgres redis
# Check a service:       curl localhost:8080/health   (gateway)
#
# Services are intentionally NOT wired with depends_on yet, so any one of them
# can run alone for quick local testing. Add depends_on per service once it
# actually talks to Postgres/Redis/the broker.

networks:
  inama-net:
    driver: bridge

volumes:
  postgres-data:
  auth-keys:   # RS256 keypair: auth writes it, gateway reads the public half

services:
  # ---------- Application services ----------
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports: ["8080:8080"]
    networks: [inama-net]
    environment:
      PORT: "8080"
      JWT_PUBLIC_KEY_PATH: "/keys/jwt_public.pem"
      REDIS_ADDR: "redis:6379"
      RATE_LIMIT_RPS: "100"
      # Next uses 3000 by default and falls back to 3001 when that port is in use.
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001"
      AUTH_ADDR: "auth:50051"
      USER_ADDR: "user:50051"
      POSTS_ADDR: "posts:50051"
      FEED_ADDR: "feed:50051"
      NOTIF_ADDR: "notifications:50051"
      SEARCH_ADDR: "search:50051"
    volumes:
      - auth-keys:/keys:ro   # read-only; auth is the only writer
    # depends_on only waits for auth to START, not for it to have written the
    # shared key. restart makes the boot race non-fatal: if the gateway gives up
    # waiting for the key, it comes back and finds it on the next try.
    restart: unless-stopped
    depends_on:
      - auth
      - redis

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "50051:50051"   # gRPC
    networks: [inama-net]
    environment:
      GRPC_PORT: "50051"
      DATABASE_URL: "postgresql+psycopg://inama:inama@postgres:5432/auth_db"
      JWT_PRIVATE_KEY_PATH: "/app/keys/jwt_private.pem"
      JWT_PUBLIC_KEY_PATH: "/app/keys/jwt_public.pem"
    volumes:
      - auth-keys:/app/keys   # generate_keys.py writes here on startup
    # Postgres may not accept connections the instant auth boots; restart lets
    # auth retry the migration step instead of dying on a cold start.
    restart: unless-stopped
    depends_on:
      - postgres

  # Relay: reads the auth_db outbox table and publishes events to RabbitMQ.
  auth-outbox-relay:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    command: ["python", "-m", "app.workers.outbox_relay"]
    networks: [inama-net]
    environment:
      DATABASE_URL: "postgresql+psycopg://inama:inama@postgres:5432/auth_db"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      - postgres
      - rabbitmq

  # One-off test runner. Not started by `docker compose up` (test profile).
  # Run the full Auth suite in a container against postgres + rabbitmq:
  #   docker compose --profile test run --rm auth-tests
  auth-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: services/auth/Dockerfile.test
    networks: [inama-net]
    environment:
      TEST_PG_BASE: "inama:inama@postgres:5432"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      - postgres
      - rabbitmq

  # Consumer: fakes sending a welcome email on user.registered.
  auth-email-worker:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    command: ["python", "-m", "app.workers.email_worker"]
    networks: [inama-net]
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      - rabbitmq

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    ports:
      - "8082:8080"
      - "50052:50051"
    networks: [inama-net]
    environment:
      GRPC_PORT: "50051"
      METRICS_PORT: "8080"
      DATABASE_URL: "postgres://inama:inama@postgres:5432/user_db?sslmode=disable"
      AUTO_BOOTSTRAP_SCHEMA: "true"
      DEFAULT_PAGE_LIMIT: "20"
      MAX_PAGE_LIMIT: "100"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      RABBITMQ_EXCHANGE: "inama.events"
      RABBITMQ_QUEUE: "user.profile-sync.q"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  posts:
    build: ./services/posts
    ports: ["8083:8080"]
    networks: [inama-net]
    environment:
      PORT: "8080"

  feed:
    build: ./services/feed
    ports: ["8084:8080"]
    networks: [inama-net]
    environment:
      PORT: "8080"

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    ports:
      - "8085:8080"
      - "50055:50051"
    networks: [inama-net]
    environment:
      GRPC_PORT: "50051"
      METRICS_PORT: "8080"
      DATABASE_URL: "postgres://inama:inama@postgres:5432/notif_db?sslmode=disable"
      AUTO_BOOTSTRAP_SCHEMA: "true"
      DEFAULT_PAGE_LIMIT: "20"
      MAX_PAGE_LIMIT: "100"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      RABBITMQ_EXCHANGE: "inama.events"
      RABBITMQ_QUEUE: "notif.q"
      RABBITMQ_ROUTING_KEYS: "post.liked,comment.created,user.followed"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  search:
    build: ./services/search
    ports: ["8086:8000"]
    networks: [inama-net]

  # ---------- Infrastructure ----------
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    networks: [inama-net]
    environment:
      POSTGRES_USER: inama
      POSTGRES_PASSWORD: inama
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inama -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    networks: [inama-net]

  # The system's single message broker. Management UI at http://localhost:15672
  # (guest/guest). All services that need async messaging connect to this one.
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # AMQP (services connect here)
      - "15672:15672"   # management web UI
    networks: [inama-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    networks: [inama-net]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    networks: [inama-net]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

  # ---------- Not running yet ----------
  # Elasticsearch: needed by Search in Phase 3, heavy to run — off until then.
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.x
