# Inama — full stack on one shared network.
#
# Run EVERYTHING:        docker compose up --build
# Run ONE service:       docker compose up --build gateway
# Run a service + infra:  docker compose up --build auth postgres redis
# Check a service:       curl localhost:8080/health   (gateway)
#
# Services are intentionally NOT wired with depends_on yet, so any one of them
# can run alone for quick local testing. Add depends_on per service once it
# actually talks to Postgres/Redis/the broker.

networks:
  inama-net:
    driver: bridge

volumes:
  postgres-data:

services:
  # ---------- Application services ----------
  gateway:
    build: ./services/gateway
    ports: ["8080:8080"]
    networks: [inama-net]
    environment:
      PORT: "8080"

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "50051:50051"   # gRPC
    networks: [inama-net]
    environment:
      GRPC_PORT: "50051"
      DATABASE_URL: "postgresql+psycopg://inama:inama@postgres:5432/auth_db"
    depends_on:
      - postgres

  # Relay: reads the auth_db outbox table and publishes events to RabbitMQ.
  auth-outbox-relay:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    command: ["python", "-m", "app.workers.outbox_relay"]
    networks: [inama-net]
    environment:
      DATABASE_URL: "postgresql+psycopg://inama:inama@postgres:5432/auth_db"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      - postgres
      - rabbitmq

  # Consumer: fakes sending a welcome email on user.registered.
  auth-email-worker:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    command: ["python", "-m", "app.workers.email_worker"]
    networks: [inama-net]
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      - rabbitmq

  user:
    build: ./services/user
    ports: ["8082:8080"]
    networks: [inama-net]
    environment:
      PORT: "8080"

  posts:
    build: ./services/posts
    ports: ["8083:8080"]
    networks: [inama-net]
    environment:
      PORT: "8080"

  feed:
    build: ./services/feed
    ports: ["8084:8080"]
    networks: [inama-net]
    environment:
      PORT: "8080"

  notifications:
    build: ./services/notifications
    ports: ["8085:8080"]
    networks: [inama-net]
    environment:
      PORT: "8080"

  search:
    build: ./services/search
    ports: ["8086:8000"]
    networks: [inama-net]

  # ---------- Infrastructure ----------
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    networks: [inama-net]
    environment:
      POSTGRES_USER: inama
      POSTGRES_PASSWORD: inama
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    networks: [inama-net]

  # The system's single message broker. Management UI at http://localhost:15672
  # (guest/guest). All services that need async messaging connect to this one.
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # AMQP (services connect here)
      - "15672:15672"   # management web UI
    networks: [inama-net]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    networks: [inama-net]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    networks: [inama-net]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

  # ---------- Not running yet ----------
  # Elasticsearch: needed by Search in Phase 3, heavy to run — off until then.
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.x
