syntax = "proto3";

package inama.auth.v1;

option go_package = "github.com/mashmool0/inama/proto/gen/auth;authpb";

// Conventions (see proto/README.md):
//   - IDs are UUID strings.
//   - Caller identity travels in gRPC metadata; Auth's pre-login RPCs are the
//     exception (there is no authenticated caller yet).
//
// Email + username based. Signup takes email/username/password and logs the
// user in immediately (no verification step). Login accepts username OR email.
// Auth signs JWTs with a private key; the Gateway verifies with the public key.

service AuthService {
  rpc Register(RegisterRequest) returns (TokenPair);
  rpc Login(LoginRequest) returns (TokenPair);
  rpc RefreshToken(RefreshTokenRequest) returns (TokenPair);
  rpc UpdateUsername(UpdateUsernameRequest) returns (UpdateUsernameResponse);
}

// Issued on successful auth. access_token is short-lived; refresh_token is long-lived.
message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3; // access token lifetime, seconds
}

message RegisterRequest {
  string email = 1;
  string username = 2;
  string password = 3;
}

message LoginRequest {
  string identifier = 1; // username OR email
  string password = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

// Auth owns username uniqueness. Caller identity is read from x-user-id metadata.
message UpdateUsernameRequest {
  string username = 1;
}

message UpdateUsernameResponse {
  string username = 1;
}
